<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사르디나 회전초밥</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://plate.sardina.love/">
  <meta property="og:title" content="사르디나 회전초밥">
  <meta property="og:image" content="https://plate.sardina.love/thumb.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="사르디나 회전초밥">
  <meta name="twitter:image" content="https://plate.sardina.love/thumb.png">

  <style>
:root {
      --bg-wall: #281e1a;
      --wood-light: #d69f63;
      --wood-mid: #b57d43;
      --wood-dark: #6e441f;
      --rail-bg: #2b2d2f;
      --rail-track: #222426;
      --accent: #e06d53;
      --ui-scale: 1;
      --menu-scale: 1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-wall);
      color: #fff;
    }

    .shop-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .wall-area {
      flex: 0.85;
      background: radial-gradient(circle at 50% 60%, #4a382e 0%, #221915 85%);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      border-bottom: 10px solid var(--wood-dark);
      box-shadow: inset 0 -15px 35px rgba(0,0,0,0.6);
      z-index: 1;
    }

.menu-board {
      display: flex;
      gap: 14px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--menu-scale, 1));
      transform-origin: center center;
      opacity: 0.82;
    }

    .menu-plaque {
      width: 40px;
      height: 118px;
      background: linear-gradient(180deg, #d4ab75 0%, #bd9056 100%);
      border: 2px solid #7c562b;
      border-radius: 3px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      color: #2b1d0e;
      font-weight: 800;
      letter-spacing: 1.5px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.45);
      padding: 4px 0;
    }

    .menu-plaque.special-plaque {
      background: linear-gradient(180deg, #ebd095 0%, #cfa15a 100%);
      border-color: #a67326;
      color: #4a1c0b;
      box-shadow: 0 6px 15px rgba(255, 200, 100, 0.25);
    }

.conveyor-section {
      height: calc(165px * var(--ui-scale, 1));
      background: linear-gradient(180deg, #434649 0%, #2c2e30 25%, #1f2022 100%);
      position: relative;
      border-top: 5px solid #5a5d60;
      border-bottom: 12px solid #333538;
      display: flex;
      align-items: center;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.7), 0 10px 25px rgba(0,0,0,0.5);
      overflow: visible;
      z-index: 10;
    }

    .rail-belt {
      position: absolute;
      bottom: calc(16px * var(--ui-scale, 1));
      left: 0;
      width: 100%;
      height: calc(58px * var(--ui-scale, 1));
      background-image: linear-gradient(
        90deg,
        #2b2d30 0%,
        #2b2d30 92.8%,
        #18191b 92.8%,
        #18191b 100%
      );
      background-size: 42px 100%;
      border-top: calc(3px * var(--ui-scale, 1)) solid #3c3f42;
      border-bottom: calc(4px * var(--ui-scale, 1)) solid #141516;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
    }

    .plates-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: visible;
    }

    .sushi-item {
      position: absolute;
      bottom: calc(22px * var(--ui-scale, 1));
      width: 150px;
      height: 135px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transform: scale(var(--ui-scale, 1));
      transform-origin: bottom left;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s;
      will-change: left, transform;
    }

    .sushi-item:hover {
      transform: translateY(-6px) scale(calc(var(--ui-scale, 1) * 1.05));
      filter: drop-shadow(0 8px 14px rgba(255, 220, 160, 0.4));
      z-index: 50;
    }

    .sushi-item.disabled-pick {
      cursor: not-allowed;
    }

    .sushi-item.disabled-pick:hover {
      transform: scale(var(--ui-scale, 1));
      filter: none;
    }

    .sushi-label {
      position: absolute;
      top: -18px;
      background: rgba(15, 12, 10, 0.94);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 10px rgba(0,0,0,0.55);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .sushi-label.today-special-label {
      border-color: #ffd56b;
      color: #ffe8a3;
    }

    .sushi-item:hover .sushi-label {
      opacity: 1;
      transform: translateY(0);
    }

    .active-sushi-display .sushi-label {
      display: none;
    }

    .food-visual-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: -24px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }

    .custom-sushi-img {
      max-width: 108px;
      max-height: 82px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.45));
      transform: translateY(-4px);
    }

    .plate-base-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .counter-table {
      flex: 1.45;
      background: linear-gradient(180deg, #6e4823 0%, #b88149 18%, #d69f65 75%, #c2894e 100%);
      border-top: 10px solid #4d3014;
      border-bottom: 18px solid #5a3818;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: end;
      padding: 20px 40px 28px 40px;
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.45);
      perspective: 900px;
      z-index: 30;
    }

.left-stack-zone {
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      padding-bottom: 8px;
      pointer-events: none;
      transform: scale(var(--ui-scale, 1));
      transform-origin: bottom center;
    }

    .stack-area-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      position: relative;
    }

    .plate-stack-wrapper {
      position: relative;
      width: 150px;
      height: 260px;
      display: flex;
      justify-content: center;
      overflow: visible;
    }

.stacked-plate-svg {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 145px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.38));
      transition: bottom 0.25s ease-out;
      animation: dropPlate 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    }

.stacked-plate-svg svg,
    .stacked-bowl-svg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bowl-layer-part {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stacked-bowl-svg {
      position: absolute;
      left: 50%;
      width: 136px;
      height: 70px;
      margin-left: -68px;
      transition: bottom 0.25s ease-out;
    }

    @keyframes dropPlate {
      from {
        transform: translateX(-50%) translateY(-40px) scale(1.06);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    .stack-count-badge {
      margin-top: 10px;
      background: rgba(40, 26, 14, 0.82);
      color: #f7e9dc;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      z-index: 35;
      white-space: nowrap;
    }

.center-eating-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      height: auto;
      padding-bottom: 6px;
      pointer-events: none;
      transform: scale(var(--ui-scale, 1));
      transform-origin: bottom center;
    }

    .mat-stage {
      position: relative;
      width: 340px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 650px;
    }

    .bamboo-mat-surface {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        #382c22 0px,
        #382c22 5px,
        #271e17 5px,
        #271e17 7px
      );
      border-radius: 10px;
      border: 4px solid #1f1711;
      border-bottom-width: 8px;
      transform: rotateX(48deg);
      transform-origin: center bottom;
      box-shadow: 0 18px 28px rgba(0,0,0,0.55);
    }

    .eating-slot {
      position: relative;
      z-index: 5;
      width: 220px;
      height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .active-sushi-display {
      transform: scale(1.26);
      animation: bringToTable 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    @keyframes bringToTable {
      from {
        transform: translateY(-85px) scale(0.95);
        opacity: 0.4;
      }
      to {
        transform: translateY(0) scale(1.26);
        opacity: 1;
      }
    }

    .eating-status-bar {
      position: absolute;
      bottom: 8px;
      width: 72%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }

    .eating-status-text {
      font-size: 11.5px;
      color: #ffe4c4;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a76, #ff6b6b);
      transition: width 0.15s linear;
    }

    .chopsticks-set {
      margin-top: 10px;
      position: relative;
      width: 250px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chopstick-rest {
      position: absolute;
      left: 38px;
      width: 24px;
      height: 14px;
      background: linear-gradient(180deg, #3c3c3c 0%, #1a1a1a 100%);
      border-radius: 4px 4px 2px 2px;
      box-shadow: 0 5px 8px rgba(0,0,0,0.5);
      transform: perspective(100px) rotateX(25deg);
    }

    .chopsticks {
      width: 225px;
      height: 14px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .stick {
      width: 100%;
      height: 4.5px;
      background: linear-gradient(90deg, #4a2c11 0%, #c88f52 35%, #e8bc84 100%);
      border-radius: 3px;
      box-shadow: 0 3px 5px rgba(0,0,0,0.45);
      transform-origin: 96% 50%;
      transition: transform 0.2s ease;
    }

    .chopsticks-set.eating-motion .stick-top {
      animation: topStickPinch 1.3s ease-in-out infinite;
    }

    .chopsticks-set.eating-motion .stick-bottom {
      animation: bottomStickPinch 1.3s ease-in-out infinite;
    }

    @keyframes topStickPinch {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(3.8deg); }
      65% { transform: rotate(-0.6deg); }
    }

    @keyframes bottomStickPinch {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-1.5deg); }
      65% { transform: rotate(0.4deg); }
    }

.right-side-zone {
      height: auto; 
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      padding-bottom: 12px;
      position: relative;
      pointer-events: none;
      transform: scale(var(--ui-scale, 1));
      transform-origin: bottom center;
    }

    .side-vessel-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 12px 14px rgba(0,0,0,0.45));
      transition: transform 0.3s ease, margin 0.3s ease;
      pointer-events: auto;
    }

    .miso-vessel {
      z-index: 4;
      transform: translate(-6px, 10px) scale(0.95);
    }
    .tea-vessel {
      z-index: 2;
      margin-left: -45px;
      transform: translate(12px, -20px) scale(0.86);
    }

    .steam-wrap {
      position: absolute;
      top: -18px;
      display: flex;
      gap: 10px;
      pointer-events: none;
      z-index: 5;
    }

    .steam-line {
      width: 4px;
      height: 24px;
      background: rgba(255,255,255,0.38);
      border-radius: 10px;
      filter: blur(3px);
      animation: steamRise 2.6s infinite ease-in-out;
    }

    .steam-line:nth-child(2) {
      animation-delay: 1.3s;
      height: 19px;
    }

    @keyframes steamRise {
      0% { transform: translateY(8px) scaleX(1); opacity: 0; }
      50% { transform: translateY(-6px) scaleX(1.5); opacity: 0.65; }
      100% { transform: translateY(-20px) scaleX(1); opacity: 0; }
    }

    .toast-notice {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(28, 22, 18, 0.94);
      color: #ffe8d1;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 300;
      white-space: nowrap;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .top-right-controls {
      position: fixed;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 120;
    }

    .checkout-btn {
      height: 42px;
      padding: 0 16px;
      border-radius: 21px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
      opacity: 0.65;
    }

    .checkout-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.04);
    }

    .add-image-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
      opacity: 0.5;
    }

    .add-image-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.06);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #2c2420;
      border: 1px solid #4e3f38;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.65);
      color: #f5ebe6;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 17px;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .upload-label {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: filter 0.2s;
    }

    .upload-label:hover {
      filter: brightness(1.1);
    }

    #imageFileInput {
      display: none;
    }

    .saved-images-grid {
      margin-top: 16px;
      max-height: 190px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 4px;
    }

    .saved-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #555;
      background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .saved-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .delete-thumb-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.8);
      color: #ff7b7b;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .receipt-modal-card {
      background: #231b17;
      border: 1px solid #523e35;
      border-radius: 18px;
      width: 100%;
      max-width: 470px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      color: #f5ebe6;
    }

    .receipt-preview-scroll {
      flex: 1;
      overflow-y: auto;
      border-radius: 12px;
      background: #1a1310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .receipt-preview-scroll,
    .saved-images-grid {
      scrollbar-width: thin;
      scrollbar-color: rgba(214, 159, 99, 0.28) transparent;
    }

    .receipt-preview-scroll::-webkit-scrollbar,
    .saved-images-grid::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .receipt-preview-scroll::-webkit-scrollbar-track,
    .saved-images-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .receipt-preview-scroll::-webkit-scrollbar-thumb,
    .saved-images-grid::-webkit-scrollbar-thumb {
      background: rgba(214, 159, 99, 0.28);
      border-radius: 10px;
    }

    .receipt-rendered-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      user-select: auto !important;
      -webkit-user-select: auto !important;
      -webkit-touch-callout: default !important;
      pointer-events: auto !important;
    }

    .receipt-mobile-tip {
      font-size: 11.5px;
      color: #bfa89b;
      text-align: center;
      margin: 8px 0 4px 0;
    }

    .receipt-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .receipt-action-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 10px;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: filter 0.2s, transform 0.1s;
    }

    .receipt-action-btn:active {
      transform: scale(0.98);
    }

    .btn-save-img {
      background: var(--accent);
      color: #fff;
    }

    .btn-share-text {
      background: #d4ab75;
      color: #2b1d0e;
    }

    .btn-reset-shop {
      background: #42332c;
      color: #e2d1c7;
      flex: 0.7;
    }

@media (max-width: 900px) {
      .wall-area {
        flex: 0.95;
      }

      .menu-board {
        top: auto;
        bottom: 14px;

    function autoCropTransparentImage(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imgData.data;

          let top = canvas.height, left = canvas.width, right = 0, bottom = 0;
          let hasOpaquePixel = false;

          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
              const alpha = pixels[(y * canvas.width + x) * 4 + 3];
              if (alpha > 15) {
                hasOpaquePixel = true;
                if (x < left) left = x;
                if (x > right) right = x;
                if (y < top) top = y;
                if (y > bottom) bottom = y;
              }
            }
          }

          if (!hasOpaquePixel) {
            resolve(dataUrl);
            return;
          }

          const trimWidth = right - left + 1;
          const trimHeight = bottom - top + 1;

          const maxDim = 320;
          let scale = 1;
          if (trimWidth > maxDim || trimHeight > maxDim) {
            scale = Math.min(maxDim / trimWidth, maxDim / trimHeight);
          }

          const outCanvas = document.createElement('canvas');
          outCanvas.width = Math.max(1, Math.round(trimWidth * scale));
          outCanvas.height = Math.max(1, Math.round(trimHeight * scale));

          const outCtx = outCanvas.getContext('2d');
          outCtx.drawImage(
            canvas,
            left, top, trimWidth, trimHeight,
            0, 0, outCanvas.width, outCanvas.height
          );

          resolve(outCanvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    const DB_NAME = 'PeacefulSushiDB';
    const STORE_NAME = 'customImages';
    let dbInstance = null;
    let customImagesList = [];

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          dbInstance = e.target.result;
          loadCustomImages().then(resolve);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function loadCustomImages() {
      return new Promise((resolve) => {
        if (!dbInstance) return resolve([]);
        const tx = dbInstance.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          customImagesList = req.result || [];
          renderSavedImagesGrid();
          resolve(customImagesList);
        };
      });
    }

    function saveCustomImage(dataUrl) {
      return new Promise((resolve) => {
        const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.add({ dataUrl });
        tx.oncomplete = () => {
          loadCustomImages().then(resolve);
        };
      });
    }

      };
    }

    function syncCustomStats() {
      const currentIds = new Set(customImagesList.map(img => img.id));
      for (const id of customStats.keys()) {
        if (!currentIds.has(id)) customStats.delete(id);
      }
      const existingCounts = Array.from(customStats.values()).map(s => s.spawnCount);
      const minCount = existingCounts.length > 0 ? Math.min(...existingCounts) : 0;

      customImagesList.forEach(img => {
        if (!customStats.has(img.id)) {
          customStats.set(img.id, { spawnCount: minCount, drought: 0 });
        }
      });
    }

    function pickWeightedCustomImage() {
      syncCustomStats();
      if (customImagesList.length === 1) return customImagesList[0];

      const onRailCustomIds = new Set(
        activePlatesOnRail.filter(p => p.data.isCustom).map(p => p.data.customId)
      );

      const allCounts = Array.from(customStats.values()).map(s => s.spawnCount);
      const minSpawnCount = Math.min(...allCounts);

      const weights = customImagesList.map(img => {
        const stat = customStats.get(img.id);
        let weight = 10;

        weight += Math.pow(stat.drought, 1.5);

        const excess = stat.spawnCount - minSpawnCount;
        if (excess > 0) {
          weight /= (1 + excess * 1.2);
        }

        if (onRailCustomIds.has(img.id)) {
          weight *= 0.08;
        }

        return Math.max(0.1, weight);
      });

      const totalWeight = weights.reduce((acc, w) => acc + w, 0);
      let randomVal = Math.random() * totalWeight;

      for (let i = 0; i < customImagesList.length; i++) {
        randomVal -= weights[i];
        if (randomVal <= 0) {
          return customImagesList[i];
        }
      }
      return customImagesList[customImagesList.length - 1];
    }

    function pickWeightedMenu() {
      const hasCustom = customImagesList.length > 0;
      const pool = hasCustom
        ? [...SUSHI_MENU, { id: SPECIAL_GROUP_KEY, isCustomGroup: true }]
        : SUSHI_MENU;

      const onRailIds = new Set(
        activePlatesOnRail.map(p => p.data.isCustom ? SPECIAL_GROUP_KEY : p.data.id)
      );

      const activeStats = pool.map(item => menuStats.get(item.id));
      const minSpawnCount = Math.min(...activeStats.map(s => s.spawnCount));

      const weights = pool.map(item => {
        const stat = menuStats.get(item.id);
        let weight = 10;

        weight += Math.pow(stat.drought, 1.6);

        if (stat.spawnCount === 0 && stat.drought > 12) {
          weight += 80;
        } else if (stat.drought >= 25) {
          weight += 120;
        }

        const excess = stat.spawnCount - minSpawnCount;
        if (excess > 0) {
          if (pickedSpecialIds.has(item.id)) {
            const specialExcess = Math.max(0, excess - 1);
            weight /= (1 + specialExcess * 0.35);
          } else {
            weight /= (1 + excess * 0.65);
          }
        }

        if (pickedSpecialIds.has(item.id)) {
          weight *= 1.6;
        }

        if (onRailIds.has(item.id)) {
          weight *= 0.08;
        }

        const isLastSpawned = item.isCustomGroup
          ? (lastSpawnedKey && lastSpawnedKey.startsWith('custom_'))
          : (item.id === lastSpawnedKey);

        if (isLastSpawned) {
          weight = 0;
        }

        return Math.max(0.1, weight);
      });

      const totalWeight = weights.reduce((acc, w) => acc + w, 0);
      let randomVal = Math.random() * totalWeight;

      for (let i = 0; i < pool.length; i++) {
        randomVal -= weights[i];
        if (randomVal <= 0) {
          return pool[i];
        }
      }
      return pool[pool.length - 1];
    }

    function spawnPlateAt(baseXPos) {
      const data = generatePlateData();
      const el = buildPlateElement(data);
      el.style.left = `${baseXPos * currentUiScale}px`;
      platesLayer.appendChild(el);

      const plateObj = { el, data, x: baseXPos };
      el.addEventListener('click', () => handlePickPlate(plateObj));
      activePlatesOnRail.push(plateObj);
    }

    function enqueueRequestedSushi(menuItem) {
      const offscreenPlates = activePlatesOnRail.filter(p => p.x < -40 && !p.isOrdered);
      if (offscreenPlates.length > 0) {
        offscreenPlates.sort((a, b) => b.x - a.x);
        const targetPlate = offscreenPlates[0];

        const newData = createPlateDataFromMenu(menuItem);
        const newEl = buildPlateElement(newData);
        newEl.style.left = `${targetPlate.x * currentUiScale}px`;
        platesLayer.replaceChild(newEl, targetPlate.el);

        targetPlate.data = newData;
        targetPlate.el = newEl;
        targetPlate.isOrdered = true;
        newEl.addEventListener('click', () => handlePickPlate(targetPlate));
      } else {
        requestedOrderQueue.push(menuItem);
      }
    }

    function initRail() {
      const logicalScreenWidth = window.innerWidth / currentUiScale;
      const count = Math.ceil(logicalScreenWidth / PLATE_SPACING) + 2;
      for (let i = -1; i < count; i++) {
        spawnPlateAt(i * PLATE_SPACING);
      }
    }

function animateRail() {
      const logicalScreenWidth = window.innerWidth / currentUiScale;

      beltOffsetX = (beltOffsetX + RAIL_SPEED) % 42;
      railBelt.style.backgroundPositionX = `${beltOffsetX * currentUiScale}px`;
      railBelt.style.backgroundSize = `${42 * currentUiScale}px 100%`;

      for (let i = activePlatesOnRail.length - 1; i >= 0; i--) {
        const item = activePlatesOnRail[i];
        item.x += RAIL_SPEED;
        item.el.style.left = `${item.x * currentUiScale}px`;

        if (item.x > logicalScreenWidth + 120) {
          item.el.remove();
          activePlatesOnRail.splice(i, 1);
        }
      }

      if (activePlatesOnRail.length === 0) {
        spawnPlateAt(-PLATE_SPACING);
      } else {
        const leftmostX = Math.min(...activePlatesOnRail.map(p => p.x));
        if (leftmostX > -PLATE_SPACING) {
          spawnPlateAt(leftmostX - PLATE_SPACING);
        }
      }

      requestAnimationFrame(animateRail);
    }

    function handlePickPlate(plateObj) {
      if (isShopClosed) {
        showToast('오늘의 영업이 종료되었습니다! 영수증을 확인해 주세요. 🧾');

        return;
      }

      isCurrentlyEating = true;
      updateRailCursorState();

      const idx = activePlatesOnRail.indexOf(plateObj);
      if (idx > -1) activePlatesOnRail.splice(idx, 1);
      plateObj.el.remove();

      const displayClone = buildPlateElement(plateObj.data);
      displayClone.className = 'active-sushi-display';
      eatingSlot.appendChild(displayClone);

      const minTime = 5000;
      const maxTime = 8000;
      const eatDurationMs = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;
      startEatingProcess(plateObj.data, displayClone, eatDurationMs);

    function startEatingProcess(plateData, displayElement, durationMs) {
      eatingStatusBar.style.display = 'flex';
      chopsticksSet.classList.add('eating-motion');
      progressFill.style.width = '100%';
      eatingStatusText.textContent = `${plateData.name} 음미하는 중...`;

      const startTime = performance.now();

      function updateProgress(now) {
        const elapsed = now - startTime;
        const remainingRatio = Math.max(0, 1 - elapsed / durationMs);

        progressFill.style.width = `${remainingRatio * 100}%`;

        if (elapsed < durationMs) {
          requestAnimationFrame(updateProgress);
        } else {
          finishEating(plateData, displayElement);
        }
      }

      requestAnimationFrame(updateProgress);
    }

    function finishEating(plateData, displayElement) {
      displayElement.remove();
      eatingStatusBar.style.display = 'none';
      chopsticksSet.classList.remove('eating-motion');

      addPlateToStack(plateData);

      isCurrentlyEating = false;
      updateRailCursorState();
    }

      const isSmallMobile = window.innerWidth <= 560;
      const isMobile = window.innerWidth <= 900;

      const plateGap = isSmallMobile ? 7 : (isMobile ? 7.8 : 8.5);
      const bowlGap = isSmallMobile ? 13.5 : (isMobile ? 15 : 17.5);
      const bowlSeatOffset = isSmallMobile ? 4 : (isMobile ? 5 : 6);

      stackedSushiElements.forEach((el) => {

    function generateReceiptCanvasDataURL(isAutoClosed = false) {
      const items = Array.from(eatenHistoryMap.values());
      const rowHeight = 28;
      const itemsBlockHeight = Math.max(1, items.length) * rowHeight;
      const closedBannerHeight = isAutoClosed ? 44 : 0;

      const paperWidth = 380;
      const paperHeight = 430 + itemsBlockHeight + closedBannerHeight;
      const marginX = 75;
      const marginY = 75;

      const canvasWidth = paperWidth + marginX * 2;
      const canvasHeight = paperHeight + marginY * 2;

      const canvas = document.createElement('canvas');
      const scale = 2; 
      canvas.width = canvasWidth * scale;
      canvas.height = canvasHeight * scale;

      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const bgGrad = ctx.createRadialGradient(
        canvasWidth / 2, canvasHeight / 2, 40,
        canvasWidth / 2, canvasHeight / 2, Math.max(canvasWidth, canvasHeight) * 0.75
      );
      bgGrad.addColorStop(0, '#4e382e');
      bgGrad.addColorStop(0.55, '#33241d');
      bgGrad.addColorStop(1, '#221712');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.strokeStyle = 'rgba(214, 159, 99, 0.22)';
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, canvasWidth - 36, canvasHeight - 36);

      ctx.save();
      ctx.translate(canvasWidth / 2, canvasHeight / 2);
      ctx.rotate(-1.8 * Math.PI / 180);
      const halfW = paperWidth / 2;
      const halfH = paperHeight / 2;
      const zigW = 10;
      const zigH = 7;

      function traceReceiptPath() {
        ctx.beginPath();
        ctx.moveTo(-halfW, -halfH + zigH);
        for (let x = -halfW; x < halfW; x += zigW) {
          const midX = Math.min(x + zigW / 2, halfW);
          const nextX = Math.min(x + zigW, halfW);
          ctx.lineTo(midX, -halfH);
          ctx.lineTo(nextX, -halfH + zigH);
        }
        ctx.lineTo(halfW, halfH - zigH);
        for (let x = halfW; x > -halfW; x -= zigW) {
          const midX = Math.max(x - zigW / 2, -halfW);
          const nextX = Math.max(x - zigW, -halfW);
          ctx.lineTo(midX, halfH);
          ctx.lineTo(nextX, halfH - zigH);
        }
        ctx.closePath();
      }

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 26;
      ctx.shadowOffsetX = 6;
      ctx.shadowOffsetY = 14;
      traceReceiptPath();
      ctx.fillStyle = '#faf8f5';
      ctx.fill();
      ctx.restore();

      ctx.save();
      traceReceiptPath();
      ctx.clip();

      const paperGrad = ctx.createLinearGradient(-halfW, -halfH, halfW, halfH);
      paperGrad.addColorStop(0, '#fcfbf9');
      paperGrad.addColorStop(0.5, '#f4f1ea');
      paperGrad.addColorStop(1, '#ebe6dc');
      ctx.fillStyle = paperGrad;
      ctx.fillRect(-halfW, -halfH, paperWidth, paperHeight);

      const foldGrad = ctx.createLinearGradient(0, -halfH, 0, halfH);
      foldGrad.addColorStop(0, 'rgba(0, 0, 0, 0.02)');
      foldGrad.addColorStop(0.28, 'rgba(255, 255, 255, 0.35)');
      foldGrad.addColorStop(0.30, 'rgba(90, 75, 60, 0.045)');
      foldGrad.addColorStop(0.65, 'rgba(255, 255, 255, 0.25)');
      foldGrad.addColorStop(0.68, 'rgba(90, 75, 60, 0.04)');
      foldGrad.addColorStop(1, 'rgba(0, 0, 0, 0.03)');
      ctx.fillStyle = foldGrad;
      ctx.fillRect(-halfW, -halfH, paperWidth, paperHeight);

      ctx.strokeStyle = 'rgba(120, 105, 90, 0.08)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-halfW + 20, -halfH + 80);
      ctx.lineTo(halfW - 40, -halfH + 135);
      ctx.moveTo(-halfW + 45, halfH - 160);
      ctx.lineTo(halfW - 15, halfH - 115);
      ctx.stroke();

      let curY = -halfH + 46;
      const leftX = -halfW + 28;
      const rightX = halfW - 28;

      ctx.fillStyle = '#1e1b18';
      ctx.textAlign = 'center';
      ctx.font = '900 22px "Pretendard", "Malgun Gothic", sans-serif';
      ctx.fillText('사르디나 회전초밥', 0, curY);

      curY += 20;
      ctx.fillStyle = '#665e57';
      ctx.font = '600 11.5px "Courier New", monospace';
      ctx.fillText('SARDINA KAITEN-ZUSHI RECEIPT', 0, curY);

      curY += 24;
      ctx.fillStyle = '#4a433d';
      ctx.font = '500 12px "Pretendard", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`결제일시: ${formatCurrentDateTime()}`, leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText('POS #01', rightX, curY);

      function drawDottedDivider(yPos) {
        ctx.save();
        ctx.strokeStyle = '#7a7067';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(leftX, yPos);
        ctx.lineTo(rightX, yPos);
        ctx.stroke();
        ctx.restore();
      }

      curY += 14;
      drawDottedDivider(curY);

      curY += 20;
      ctx.fillStyle = '#2b2623';
      ctx.font = '700 12.5px "Pretendard", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('메뉴명 (ITEM)', leftX, curY);

      curY += 17;
      ctx.fillStyle = '#756a60';
      ctx.font = '600 11.5px "Courier New", monospace';
      ctx.fillText('plate.sardina.love', 0, curY);

      curY += 18;
      const barcodeHeight = 52;
      ctx.fillStyle = '#181512';

      const barPattern = [
        3, 1, 2, 1, 4, 1, 1, 2, 3, 1, 2, 1, 1, 3, 2, 1,
        2, 1, 4, 1, 2, 1, 3, 1, 1, 2, 1, 3, 1, 2, 2, 1,
        3, 1, 1, 2, 4, 1, 2, 1, 3
      ];
      const unitWidth = 3.1; 
      const totalBarWidth = barPattern.reduce((sum, val) => sum + val * unitWidth, 0);
      let bx = -totalBarWidth / 2;

      for (let i = 0; i < barPattern.length; i++) {
        const w = barPattern[i] * unitWidth;
        if (i % 2 === 0) {
          ctx.fillRect(bx, curY, w, barcodeHeight);
        }
        bx += w;
      }

      curY += barcodeHeight + 15;
      ctx.fillStyle = '#554d46';
      ctx.font = '600 11px "Courier New", monospace';
      ctx.fillText(`* SRDN-${String(eatenPlatesCount).padStart(2, '0')}-${String(totalAmount).padStart(6, '0')} *`, 0, curY);

      ctx.restore(); 
      ctx.restore(); 

      return canvas.toDataURL('image/png');
    }

    function openReceiptModal(isAutoClosed = false) {
      if (eatenPlatesCount === 0) {
        showToast('아직 접시가 없어요! 초밥을 1접시 이상 드셔보세요.');
        return;
      }

      const dataUrl = generateReceiptCanvasDataURL(isAutoClosed);
      receiptRenderedImg.src = dataUrl;
      receiptModal.classList.add('open');
    }

    checkoutBtn.addEventListener('click', () => {
      openReceiptModal(isShopClosed);
    });

    closeReceiptBtn.addEventListener('click', () => {
      receiptModal.classList.remove('open');
    });

    receiptModal.addEventListener('click', (e) => {
      if (e.target === receiptModal) receiptModal.classList.remove('open');
    });

    downloadReceiptBtn.addEventListener('click', () => {
      if (!receiptRenderedImg.src) return;
      const link = document.createElement('a');
      link.download = `사르디나_회전초밥_영수증_${eatenPlatesCount}접시.png`;
      link.href = receiptRenderedImg.src;
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('영수증 이미지가 저장되었습니다!');
    });

    shareReceiptBtn.addEventListener('click', () => {
      const shareText = `사르디나 회전초밥집에서 ${eatenPlatesCount}접시를 먹었습니다!`;
      const shareUrl = 'https://plate.sardina.love';
      const twitterIntentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
      window.open(twitterIntentUrl, '_blank', 'width=550,height=420,noopener,noreferrer');
    });

resetShopBtn.addEventListener('click', () => {
      eatenPlatesCount = 0;
      eatenHistoryMap.clear();
      isShopClosed = false;
      stackedSushiElements = [];
      stackedMealElements = [];
      plateStackWrapper.innerHTML = '';
      stackCountBadge.textContent = '먹은 접시: 0접시';
      
      menuStats.forEach(stat => {
        stat.spawnCount = 0;
        stat.drought = 0;
      });
      customStats.clear();

      updateRailCursorState();
      receiptModal.classList.remove('open');
      showToast('테이블을 깔끔하게 정리했습니다! 새로운 식사를 시작해 보세요.');
    });

    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const imageModal = document.getElementById('imageModal');
    const imageFileInput = document.getElementById('imageFileInput');
    const savedImagesGrid = document.getElementById('savedImagesGrid');

    openModalBtn.addEventListener('click', () => imageModal.classList.add('open'));
    closeModalBtn.addEventListener('click', () => imageModal.classList.remove('open'));
    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) imageModal.classList.remove('open');
    });

    imageFileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const trimmedDataUrl = await autoCropTransparentImage(event.target.result);
          await saveCustomImage(trimmedDataUrl);
        };
        reader.readAsDataURL(file);
      });
      imageFileInput.value = '';
    });

    function renderSavedImagesGrid() {
      savedImagesGrid.innerHTML = '';
      customImagesList.forEach(item => {
        const thumb = document.createElement('div');
        thumb.className = 'saved-thumb';

        const img = document.createElement('img');
        img.src = item.dataUrl;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-thumb-btn';
        delBtn.innerHTML = '&times;';
        delBtn.title = '삭제';
        delBtn.addEventListener('click', () => deleteCustomImage(item.id));

        thumb.appendChild(img);
        thumb.appendChild(delBtn);
        savedImagesGrid.appendChild(thumb);
      });
    }

    initDatabase().then(() => {
      initRail();
      requestAnimationFrame(animateRail);
    });

    const openOrderModalBtn = document.getElementById('openOrderModalBtn');
    const closeOrderModalBtn = document.getElementById('closeOrderModalBtn');
    const orderModal = document.getElementById('orderModal');
    const orderKioskGrid = document.getElementById('orderKioskGrid');
    const submitOrderBtn = document.getElementById('submitOrderBtn');

    let selectedOrderItem = null;

    function renderOrderKioskList() {
      orderKioskGrid.innerHTML = '';
      selectedOrderItem = null;
      submitOrderBtn.disabled = true;
      submitOrderBtn.textContent = '메뉴를 선택해 주세요';

      const lightPlateColors = new Set(['#91c1eb', '#bda460']);

      function createKioskCard(menu) {
        const card = document.createElement('div');
        card.className = 'kiosk-menu-item';

        if (menu.isSpecial) {
          const specialBadge = document.createElement('span');
          specialBadge.className = 'kiosk-special-badge';
          specialBadge.textContent = menu.isCustomItem ? '스페셜' : '오늘의특선';
          card.appendChild(specialBadge);
        }

        const visualBox = document.createElement('div');
        visualBox.className = 'kiosk-visual-box';
        if (menu.isCustomItem) {
          const img = document.createElement('img');
          img.src = menu.imageUrl;
          visualBox.appendChild(img);
        } else {
          visualBox.innerHTML = menu.svg;
        }
        card.appendChild(visualBox);

        const nameEl = document.createElement('div');
        nameEl.className = 'kiosk-menu-name';
        nameEl.textContent = menu.name;
        card.appendChild(nameEl);

        card.addEventListener('click', () => {
          orderKioskGrid.querySelectorAll('.kiosk-menu-item').forEach(el => {
            el.classList.remove('selected');
          });
          card.classList.add('selected');
          selectedOrderItem = menu;
          submitOrderBtn.disabled = false;
          submitOrderBtn.textContent = `[${menu.name}] 주문하기 (${formatCurrency(menu.price)})`;
        });

        return card;
      }

      function appendGroupSection({ badgeText, plateColor, rimColor, items }) {
        const groupWrap = document.createElement('div');
        groupWrap.className = 'kiosk-price-group';

        const header = document.createElement('div');
        header.className = 'kiosk-group-header';

        const badge = document.createElement('div');
        badge.className = 'kiosk-price-badge';
        badge.style.backgroundColor = plateColor;
        badge.style.border = `1.5px solid ${rimColor}`;
        badge.style.color = lightPlateColors.has(plateColor) ? '#1e1610' : '#fffaf5';

        const dot = document.createElement('span');
        dot.className = 'kiosk-plate-dot';
        dot.style.backgroundColor = plateColor;
        dot.style.border = `2px solid ${rimColor}`;

        const textSpan = document.createElement('span');
        textSpan.textContent = badgeText;

        badge.appendChild(dot);
        badge.appendChild(textSpan);
        header.appendChild(badge);
        groupWrap.appendChild(header);

        const itemsGrid = document.createElement('div');
        itemsGrid.className = 'kiosk-group-items';

        items.forEach(menu => {
          itemsGrid.appendChild(createKioskCard(menu));
        });

        groupWrap.appendChild(itemsGrid);
        orderKioskGrid.appendChild(groupWrap);
      }

      if (customImagesList.length > 0) {
        const customItems = customImagesList.map((img, idx) => ({
          id: `custom_${img.id}`,
          isCustomItem: true,
          customId: img.id,
          name: `스페셜 초밥 #${idx + 1}`,
          imageUrl: img.dataUrl,
          plateColor: '#bda460',
          rimColor: '#fff5cc',
          price: 5500,
          isSpecial: true
        }));

        appendGroupSection({
          badgeText: `스페셜 (${formatCurrency(5500)})`,
          plateColor: '#bda460',
          rimColor: '#fff5cc',
          items: customItems
        });
      }

      const regularMenus = SUSHI_MENU.map(item => ({
        ...item,
        isCustomItem: false,
        price: getPlatePrice(item),
        isSpecial: pickedSpecialIds.has(item.id)
      }));

      const priceGroupsMap = new Map();
      regularMenus.forEach(item => {
        if (!priceGroupsMap.has(item.price)) {
          priceGroupsMap.set(item.price, {
            price: item.price,
            plateColor: item.plateColor,
            rimColor: item.rimColor,
            items: []
          });
        }
        priceGroupsMap.get(item.price).items.push(item);
      });

      const sortedGroups = Array.from(priceGroupsMap.values()).sort((a, b) => a.price - b.price);

      sortedGroups.forEach(group => {
        group.items.sort((a, b) => a.name.localeCompare(b.name, 'ko'));

        appendGroupSection({
          badgeText: formatCurrency(group.price),
          plateColor: group.plateColor,
          rimColor: group.rimColor,
          items: group.items
        });
      });

      const mealItems = MEAL_MENU.map(item => ({
        ...item,
        isCustomItem: false,
        isSpecial: false
      })).sort((a, b) => a.name.localeCompare(b.name, 'ko'));

      appendGroupSection({
        badgeText: '식사류',
        plateColor: '#5c3a21',
        rimColor: '#ebd095',
        items: mealItems
      });
    }

    function serveMealDirectly(mealData) {
      isCurrentlyEating = true;
      updateRailCursorState();

      const displayClone = buildPlateElement(mealData);
      displayClone.className = 'active-sushi-display';
      eatingSlot.appendChild(displayClone);

      const minTime = 6000;
      const maxTime = 9000;
      const eatDurationMs = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;
      startEatingProcess(mealData, displayClone, eatDurationMs);
    }

    openOrderModalBtn.addEventListener('click', () => {
      if (isShopClosed) {
        showToast('오늘의 영업이 종료되어 주문을 받기 어렵습니다!');
        return;
      }
      renderOrderKioskList();
      orderModal.classList.add('open');
    });

    closeOrderModalBtn.addEventListener('click', () => {
      orderModal.classList.remove('open');
    });

    orderModal.addEventListener('click', (e) => {
      if (e.target === orderModal) orderModal.classList.remove('open');
    });

    submitOrderBtn.addEventListener('click', () => {
      if (!selectedOrderItem) return;

      if (selectedOrderItem.isMeal) {
        if (isCurrentlyEating) {
          showToast('아직 식사 중이에요! 다 드신 뒤에 식사류를 주문해 주세요.');
          return;
        }
        orderModal.classList.remove('open');
        serveMealDirectly(selectedOrderItem);
        showToast(`주문하신 [${selectedOrderItem.name}] 나왔습니다! 맛있게 드세요.`);
        return;
      }

      enqueueRequestedSushi(selectedOrderItem);
      orderModal.classList.remove('open');
      showToast(`🔔 [${selectedOrderItem.name}] 주문 완료! 곧 레일 왼쪽에서 등장합니다.`);
    });

function updateWindowScale() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isMobileLayout = w <= 900;

      let uiScale = 1;
      if (!isMobileLayout) {
        const scaleW = w / 920;
        const scaleH = h / 600;
        uiScale = Math.max(1, Math.min(Math.min(scaleW, scaleH), 2.2));
      }
      
      currentUiScale = uiScale;
      document.documentElement.style.setProperty('--ui-scale', uiScale.toFixed(3));

      if (activePlatesOnRail.length > 0) {
        const logicalScreenWidth = w / currentUiScale;
        let leftmostX = Math.min(...activePlatesOnRail.map(p => p.x));
        while (leftmostX > -PLATE_SPACING) {
          leftmostX -= PLATE_SPACING;
          spawnPlateAt(leftmostX);
        }
        let rightmostX = Math.max(...activePlatesOnRail.map(p => p.x));
        while (rightmostX < logicalScreenWidth) {
          rightmostX += PLATE_SPACING;
          spawnPlateAt(rightmostX);
        }
      }

      const wallEl = document.querySelector('.wall-area');
      if (wallEl) {
        const wallHeight = wallEl.clientHeight;
        const plaqueBaseHeight = 118; 

        if (isMobileLayout) {
          const safeWallHeight = Math.max(40, wallHeight - 68);
          const maxMobileScale = safeWallHeight / plaqueBaseHeight;
          const baseMobileTarget = w <= 560 ? 0.92 : 0.95;
          const finalMenuScale = Math.max(0.45, Math.min(baseMobileTarget, maxMobileScale));
          document.documentElement.style.setProperty('--menu-scale', finalMenuScale.toFixed(3));
        } else {
          const maxPcScale = (wallHeight * 0.74) / plaqueBaseHeight;
          const finalMenuScale = Math.max(0.55, Math.min(uiScale, maxPcScale));
          document.documentElement.style.setProperty('--menu-scale', finalMenuScale.toFixed(3));
        }
      }
    }

    window.addEventListener('resize', updateWindowScale);
    window.addEventListener('DOMContentLoaded', () => requestAnimationFrame(updateWindowScale));
    updateWindowScale();
  </script>
