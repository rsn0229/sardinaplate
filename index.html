<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사르디나 회전초밥</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://plate.sardina.love/">
  <meta property="og:title" content="사르디나 회전초밥">
  <meta property="og:image" content="https://plate.sardina.love/thumb.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="사르디나 회전초밥">
  <meta name="twitter:image" content="https://plate.sardina.love/thumb.png">

  <style>
    :root {
      --bg-wall: #281e1a;
      --wood-light: #d69f63;
      --wood-mid: #b57d43;
      --wood-dark: #6e441f;
      --rail-bg: #2b2d2f;
      --rail-track: #222426;
      --accent: #e06d53;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-wall);
      color: #fff;
    }

    .shop-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .wall-area {
      flex: 0.85;
      background: radial-gradient(circle at 50% 60%, #4a382e 0%, #221915 85%);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      border-bottom: 10px solid var(--wood-dark);
      box-shadow: inset 0 -15px 35px rgba(0,0,0,0.6);
      z-index: 1;
    }

    .menu-board {
      display: flex;
      gap: 14px;
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.82;
    }

    .menu-plaque {
      width: 40px;
      height: 118px;
      background: linear-gradient(180deg, #d4ab75 0%, #bd9056 100%);
      border: 2px solid #7c562b;
      border-radius: 3px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      color: #2b1d0e;
      font-weight: 800;
      letter-spacing: 1.5px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.45);
      padding: 4px 0;
    }

    .menu-plaque.special-plaque {
      background: linear-gradient(180deg, #ebd095 0%, #cfa15a 100%);
      border-color: #a67326;
      color: #4a1c0b;
      box-shadow: 0 6px 15px rgba(255, 200, 100, 0.25);
    }

    .conveyor-section {
      height: 165px;
      background: linear-gradient(180deg, #434649 0%, #2c2e30 25%, #1f2022 100%);
      position: relative;
      border-top: 5px solid #5a5d60;
      border-bottom: 12px solid #333538;
      display: flex;
      align-items: center;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.7), 0 10px 25px rgba(0,0,0,0.5);
      overflow: visible;
      z-index: 10;
    }

    .rail-belt {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      height: 58px;
      background: repeating-linear-gradient(
        90deg,
        #2b2d30 0px,
        #2b2d30 39px,
        #18191b 39px,
        #18191b 42px
      );
      border-top: 3px solid #3c3f42;
      border-bottom: 4px solid #141516;
      box-shadow: inset 0 6px 12px rgba(0,0,0,0.6);
    }

    .plates-layer {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: visible;
    }

    .sushi-item {
      position: absolute;
      bottom: 22px;
      width: 150px;
      height: 135px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s;
      will-change: left, transform;
    }

    .sushi-item:hover {
      transform: translateY(-6px) scale(1.05);
      filter: drop-shadow(0 8px 14px rgba(255, 220, 160, 0.4));
      z-index: 50;
    }

    .sushi-item.disabled-pick {
      cursor: not-allowed;
    }

    .sushi-item.disabled-pick:hover {
      transform: none;
      filter: none;
    }

    .sushi-label {
      position: absolute;
      top: -18px;
      background: rgba(15, 12, 10, 0.94);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 10px rgba(0,0,0,0.55);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .sushi-label.today-special-label {
      border-color: #ffd56b;
      color: #ffe8a3;
    }

    .sushi-item:hover .sushi-label {
      opacity: 1;
      transform: translateY(0);
    }

    .active-sushi-display .sushi-label {
      display: none;
    }

    .food-visual-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: -24px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }

    .custom-sushi-img {
      max-width: 108px;
      max-height: 82px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.45));
      transform: translateY(-4px);
    }

    .plate-base-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .counter-table {
      flex: 1.45;
      background: linear-gradient(180deg, #6e4823 0%, #b88149 18%, #d69f65 75%, #c2894e 100%);
      border-top: 10px solid #4d3014;
      border-bottom: 18px solid #5a3818;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: end;
      padding: 20px 40px 28px 40px;
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.45);
      perspective: 900px;
      z-index: 30;
    }

.left-stack-zone {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      padding-bottom: 8px;
      pointer-events: none;
    }

    .stack-area-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      position: relative;
    }

    .plate-stack-wrapper {
      position: relative;
      width: 150px;
      height: 260px;
      display: flex;
      justify-content: center;
      overflow: visible;
    }

    .stacked-plate-svg {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 145px;
      height: 36px;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.38));
      animation: dropPlate 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
    }

    @keyframes dropPlate {
      from {
        transform: translateX(-50%) translateY(-40px) scale(1.06);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    .stack-count-badge {
      margin-top: 10px;
      background: rgba(40, 26, 14, 0.82);
      color: #f7e9dc;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      z-index: 35;
      white-space: nowrap;
    }

    .center-eating-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      height: 100%;
      padding-bottom: 6px;
    }

    .mat-stage {
      position: relative;
      width: 340px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 650px;
    }

    .bamboo-mat-surface {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        #382c22 0px,
        #382c22 5px,
        #271e17 5px,
        #271e17 7px
      );
      border-radius: 10px;
      border: 4px solid #1f1711;
      border-bottom-width: 8px;
      transform: rotateX(48deg);
      transform-origin: center bottom;
      box-shadow: 0 18px 28px rgba(0,0,0,0.55);
    }

    .eating-slot {
      position: relative;
      z-index: 5;
      width: 220px;
      height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .active-sushi-display {
      transform: scale(1.26);
      animation: bringToTable 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    @keyframes bringToTable {
      from {
        transform: translateY(-85px) scale(0.95);
        opacity: 0.4;
      }
      to {
        transform: translateY(0) scale(1.26);
        opacity: 1;
      }
    }

    .eating-status-bar {
      position: absolute;
      bottom: 8px;
      width: 72%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }

    .eating-status-text {
      font-size: 11.5px;
      color: #ffe4c4;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a76, #ff6b6b);
      transition: width 0.15s linear;
    }

    .chopsticks-set {
      margin-top: 10px;
      position: relative;
      width: 250px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chopstick-rest {
      position: absolute;
      left: 38px;
      width: 24px;
      height: 14px;
      background: linear-gradient(180deg, #3c3c3c 0%, #1a1a1a 100%);
      border-radius: 4px 4px 2px 2px;
      box-shadow: 0 5px 8px rgba(0,0,0,0.5);
      transform: perspective(100px) rotateX(25deg);
    }

    .chopsticks {
      width: 225px;
      height: 14px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .stick {
      width: 100%;
      height: 4.5px;
      background: linear-gradient(90deg, #4a2c11 0%, #c88f52 35%, #e8bc84 100%);
      border-radius: 3px;
      box-shadow: 0 3px 5px rgba(0,0,0,0.45);
      transform-origin: 96% 50%;
      transition: transform 0.2s ease;
    }

    .chopsticks-set.eating-motion .stick-top {
      animation: topStickPinch 1.3s ease-in-out infinite;
    }

    .chopsticks-set.eating-motion .stick-bottom {
      animation: bottomStickPinch 1.3s ease-in-out infinite;
    }

    @keyframes topStickPinch {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(3.8deg); }
      65% { transform: rotate(-0.6deg); }
    }

    @keyframes bottomStickPinch {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-1.5deg); }
      65% { transform: rotate(0.4deg); }
    }

    .right-side-zone {
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 24px;
      padding-bottom: 12px;
      position: relative;
    }

    .side-vessel-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 12px 14px rgba(0,0,0,0.45));
      transition: transform 0.3s ease, margin 0.3s ease;
    }

    .miso-vessel { z-index: 3; }
    .tea-vessel { z-index: 2; }

    .steam-wrap {
      position: absolute;
      top: -18px;
      display: flex;
      gap: 10px;
      pointer-events: none;
      z-index: 5;
    }

    .steam-line {
      width: 4px;
      height: 24px;
      background: rgba(255,255,255,0.38);
      border-radius: 10px;
      filter: blur(3px);
      animation: steamRise 2.6s infinite ease-in-out;
    }

    .steam-line:nth-child(2) {
      animation-delay: 1.3s;
      height: 19px;
    }

    @keyframes steamRise {
      0% { transform: translateY(8px) scaleX(1); opacity: 0; }
      50% { transform: translateY(-6px) scaleX(1.5); opacity: 0.65; }
      100% { transform: translateY(-20px) scaleX(1); opacity: 0; }
    }

    .toast-notice {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(28, 22, 18, 0.94);
      color: #ffe8d1;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 300;
      white-space: nowrap;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .top-right-controls {
      position: fixed;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 120;
    }

    .checkout-btn {
      height: 42px;
      padding: 0 16px;
      border-radius: 21px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
      opacity: 0.65;
    }

    .checkout-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.04);
    }

    .add-image-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s, opacity 0.2s;
      opacity: 0.5;
    }

    .add-image-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.06);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #2c2420;
      border: 1px solid #4e3f38;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.65);
      color: #f5ebe6;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 17px;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .upload-label {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: filter 0.2s;
    }

    .upload-label:hover {
      filter: brightness(1.1);
    }

    #imageFileInput {
      display: none;
    }

    .saved-images-grid {
      margin-top: 16px;
      max-height: 190px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 4px;
    }

    .saved-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #555;
      background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .saved-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .delete-thumb-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.8);
      color: #ff7b7b;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .receipt-modal-card {
      background: #231b17;
      border: 1px solid #523e35;
      border-radius: 18px;
      width: 100%;
      max-width: 470px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      color: #f5ebe6;
    }

    .receipt-preview-scroll {
      flex: 1;
      overflow-y: auto;
      border-radius: 12px;
      background: #1a1310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .receipt-preview-scroll,
    .saved-images-grid {
      scrollbar-width: thin;
      scrollbar-color: rgba(214, 159, 99, 0.28) transparent;
    }

    .receipt-preview-scroll::-webkit-scrollbar,
    .saved-images-grid::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .receipt-preview-scroll::-webkit-scrollbar-track,
    .saved-images-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .receipt-preview-scroll::-webkit-scrollbar-thumb,
    .saved-images-grid::-webkit-scrollbar-thumb {
      background: rgba(214, 159, 99, 0.28);
      border-radius: 10px;
    }

    .receipt-rendered-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      user-select: auto !important;
      -webkit-user-select: auto !important;
      -webkit-touch-callout: default !important;
      pointer-events: auto !important;
    }

    .receipt-mobile-tip {
      font-size: 11.5px;
      color: #bfa89b;
      text-align: center;
      margin: 8px 0 4px 0;
    }

    .receipt-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .receipt-action-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 10px;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: filter 0.2s, transform 0.1s;
    }

    .receipt-action-btn:active {
      transform: scale(0.98);
    }

    .btn-save-img {
      background: var(--accent);
      color: #fff;
    }

    .btn-share-text {
      background: #d4ab75;
      color: #2b1d0e;
    }

    .btn-reset-shop {
      background: #42332c;
      color: #e2d1c7;
      flex: 0.7;
    }

    @media (max-width: 900px) {
      .wall-area {
        flex: 0.95;
      }
      .menu-board {
        top: auto;
        bottom: 22px;
        transform: translateX(-50%) scale(0.95);
      }

      .counter-table {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 15px 16px 24px 16px;
      }

      .center-eating-zone {
        width: 100%;
        height: auto;
        z-index: 20;
        margin-top: auto;
      }
      .mat-stage {
        width: 280px;
        height: 165px;
      }
      .chopsticks-set { width: 220px; }
      .chopsticks { width: 195px; }

      .left-stack-zone {
        position: absolute;
        left: 16px;
        bottom: 175px;
        height: auto;
        z-index: 10;
      }
      .stacked-plate-svg { width: 120px; height: 32px; }
      .plate-stack-wrapper { width: 120px; height: 200px; }

      .right-side-zone {
        position: absolute;
        right: 18px;
        bottom: 175px;
        height: auto;
        gap: 0;
        z-index: 10;
      }
      .miso-vessel {
        z-index: 4;
        transform: translate(-6px, 10px) scale(0.92);
      }
      .tea-vessel {
        z-index: 2;
        margin-left: -45px;
        transform: translate(12px, -22px) scale(0.84);
      }
    }

    @media (max-width: 560px) {
      .wall-area {
        flex: 1.05;
      }
      .menu-board {
        bottom: 20px;
        gap: 10px;
        transform: translateX(-50%) scale(0.92);
      }

    const TODAY_SPECIAL_IDS = [
      'soy_shrimp',

    ];

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const specialCandidates = SUSHI_MENU.filter(item => TODAY_SPECIAL_IDS.includes(item.id));
    const pickedFromSpecial2 = shuffleArray(specialCandidates).slice(0, 2);
    const todaySpecialItem = pickedFromSpecial2[0];
    const pickedSpecialId = todaySpecialItem.id;

    const otherCandidates = SUSHI_MENU.filter(item => !TODAY_SPECIAL_IDS.includes(item.id));
    const pickedFromOthers2 = shuffleArray(otherCandidates).slice(0, 2);
    const leftFourMenus = shuffleArray([...pickedFromSpecial2, ...pickedFromOthers2]);

    function autoCropTransparentImage(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const pixels = imgData.data;

          let top = canvas.height, left = canvas.width, right = 0, bottom = 0;
          let hasOpaquePixel = false;

          for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
              const alpha = pixels[(y * canvas.width + x) * 4 + 3];
              if (alpha > 15) {
                hasOpaquePixel = true;
                if (x < left) left = x;
                if (x > right) right = x;
                if (y < top) top = y;
                if (y > bottom) bottom = y;
              }
            }
          }

          if (!hasOpaquePixel) {
            resolve(dataUrl);
            return;
          }

          const trimWidth = right - left + 1;
          const trimHeight = bottom - top + 1;

          const maxDim = 320;
          let scale = 1;
          if (trimWidth > maxDim || trimHeight > maxDim) {
            scale = Math.min(maxDim / trimWidth, maxDim / trimHeight);
          }

          const outCanvas = document.createElement('canvas');
          outCanvas.width = Math.max(1, Math.round(trimWidth * scale));
          outCanvas.height = Math.max(1, Math.round(trimHeight * scale));

          const outCtx = outCanvas.getContext('2d');
          outCtx.drawImage(
            canvas,
            left, top, trimWidth, trimHeight,
            0, 0, outCanvas.width, outCanvas.height
          );

          resolve(outCanvas.toDataURL('image/png'));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    const DB_NAME = 'PeacefulSushiDB';
    const STORE_NAME = 'customImages';
    let dbInstance = null;
    let customImagesList = [];

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          dbInstance = e.target.result;
          loadCustomImages().then(resolve);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function loadCustomImages() {
      return new Promise((resolve) => {
        if (!dbInstance) return resolve([]);
        const tx = dbInstance.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          customImagesList = req.result || [];
          renderSavedImagesGrid();
          resolve(customImagesList);
        };
      });
    }

    function saveCustomImage(dataUrl) {
      return new Promise((resolve) => {
        const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.add({ dataUrl });
        tx.oncomplete = () => {
          loadCustomImages().then(resolve);
        };
      });
    }

    function deleteCustomImage(id) {
      const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(id);
      tx.oncomplete = () => {
        loadCustomImages();
      };
    }

    const railBelt = document.getElementById('railBelt');
    const platesLayer = document.getElementById('platesLayer');
    const eatingSlot = document.getElementById('eatingSlot');
    const eatingStatusBar = document.getElementById('eatingStatusBar');
    const eatingStatusText = document.getElementById('eatingStatusText');
    const progressFill = document.getElementById('progressFill');
    const chopsticksSet = document.getElementById('chopsticksSet');
    const plateStackWrapper = document.getElementById('plateStackWrapper');
    const stackCountBadge = document.getElementById('stackCountBadge');
    const toastNotice = document.getElementById('toastNotice');

    let activePlatesOnRail = [];
    let isCurrentlyEating = false;
    let isShopClosed = false;
    let eatenPlatesCount = 0;
    let eatenHistoryMap = new Map(); // { key: { name, price, count } }
    const MAX_PLATES_LIMIT = 25;

    const RAIL_SPEED = 0.9;
    const PLATE_SPACING = 190;
    let beltOffsetX = 0;
    let lastSpawnedKey = null;

    const menuStats = new Map();
    SUSHI_MENU.forEach(item => {
      menuStats.set(item.id, { spawnCount: 0, drought: 0 });
    });

    function pickWeightedMenu() {
      const onRailIds = new Set(
        activePlatesOnRail.filter(p => !p.data.isCustom).map(p => p.data.id)
      );

      const allCounts = Array.from(menuStats.values()).map(s => s.spawnCount);
      const minSpawnCount = Math.min(...allCounts);

      const weights = SUSHI_MENU.map(item => {
        const stat = menuStats.get(item.id);
        let weight = 10;

        weight += Math.pow(stat.drought, 1.6);

        if (stat.spawnCount === 0 && stat.drought > 12) {
          weight += 80;
        } else if (stat.drought >= 25) {
          weight += 120;
        }

        const excess = stat.spawnCount - minSpawnCount;
        if (excess > 0) {
          weight /= (1 + excess * 0.65);
        }

        if (item.id === pickedSpecialId) {
          weight *= 1.15;
        }

        if (onRailIds.has(item.id)) {
          weight *= 0.08;
        }

        if (item.id === lastSpawnedKey) {
          weight = 0;
        }

        return Math.max(0.1, weight);
      });

      const totalWeight = weights.reduce((acc, w) => acc + w, 0);
      let randomVal = Math.random() * totalWeight;

      for (let i = 0; i < SUSHI_MENU.length; i++) {
        randomVal -= weights[i];
        if (randomVal <= 0) {
          return SUSHI_MENU[i];
        }
      }
      return SUSHI_MENU[SUSHI_MENU.length - 1];
    }

    function generatePlateData() {
      let candidate = null;
      let candidateKey = '';

      const canSpawnCustom = customImagesList.length > 0 && (!lastSpawnedKey || !lastSpawnedKey.startsWith('custom_'));
      if (canSpawnCustom && Math.random() < 0.08) {
        const randomCustom = customImagesList[Math.floor(Math.random() * customImagesList.length)];
        candidate = {
          isCustom: true,
          name: '스페셜 초밥 ✨',
          imageUrl: randomCustom.dataUrl,
          plateColor: '#bda460',
          rimColor: '#fff5cc'
        };
        candidateKey = `custom_${randomCustom.id || 'special'}`;
      } else {
        const chosenMenu = pickWeightedMenu();
        const isSpecialMatch = chosenMenu.id === pickedSpecialId;
        candidate = {
          isCustom: false,
          isTodaySpecial: isSpecialMatch,
          ...chosenMenu
        };
        candidateKey = chosenMenu.id;

        SUSHI_MENU.forEach(item => {
          const stat = menuStats.get(item.id);
          if (item.id === chosenMenu.id) {
            stat.spawnCount += 1;
            stat.drought = 0;
          } else {
            stat.drought += 1;
          }
        });
      }

      lastSpawnedKey = candidateKey;
      return candidate;
    }

    function buildPlateElement(plateData) {
      const wrapper = document.createElement('div');
      wrapper.className = 'sushi-item';
      if (isCurrentlyEating || isShopClosed) wrapper.classList.add('disabled-pick');

      const label = document.createElement('div');
      label.className = 'sushi-label';
      if (plateData.isTodaySpecial) {
        label.classList.add('today-special-label');
        label.textContent = `[오늘의 특선] ${plateData.name}`;
      } else {
        label.textContent = plateData.name;
      }
      wrapper.appendChild(label);

      const foodWrap = document.createElement('div');
      foodWrap.className = 'food-visual-wrap';

      if (plateData.isCustom) {
        const img = document.createElement('img');
        img.className = 'custom-sushi-img';
        img.src = plateData.imageUrl;
        foodWrap.appendChild(img);
      } else {
        foodWrap.innerHTML = plateData.svg;
      }
      wrapper.appendChild(foodWrap);

      const plateBase = document.createElement('div');
      plateBase.className = 'plate-base-wrap';
      plateBase.innerHTML = createPerspectivePlateSVG(plateData.plateColor, plateData.rimColor);
      wrapper.appendChild(plateBase);

      return wrapper;
    }

    function spawnPlateAt(xPos) {
      const data = generatePlateData();
      const el = buildPlateElement(data);
      el.style.left = `${xPos}px`;
      platesLayer.appendChild(el);

      const plateObj = { el, data, x: xPos };
      el.addEventListener('click', () => handlePickPlate(plateObj));
      activePlatesOnRail.push(plateObj);
    }

    function initRail() {
      const screenWidth = window.innerWidth;
      const count = Math.ceil(screenWidth / PLATE_SPACING) + 2;
      for (let i = -1; i < count; i++) {
        spawnPlateAt(i * PLATE_SPACING);
      }
    }

    function animateRail() {
      const screenWidth = window.innerWidth;

      beltOffsetX = (beltOffsetX + RAIL_SPEED) % 42;
      railBelt.style.backgroundPositionX = `${beltOffsetX}px`;

      for (let i = activePlatesOnRail.length - 1; i >= 0; i--) {
        const item = activePlatesOnRail[i];
        item.x += RAIL_SPEED;
        item.el.style.left = `${item.x}px`;

        if (item.x > screenWidth + 120) {
          item.el.remove();
          activePlatesOnRail.splice(i, 1);
        }
      }

      if (activePlatesOnRail.length === 0) {
        spawnPlateAt(-PLATE_SPACING);
      } else {
        const leftmostX = Math.min(...activePlatesOnRail.map(p => p.x));
        if (leftmostX > -PLATE_SPACING) {
          spawnPlateAt(leftmostX - PLATE_SPACING);
        }
      }

      requestAnimationFrame(animateRail);
    }

    let toastTimer = null;
    function showToast(msg, duration = 2400) {
      toastNotice.textContent = msg;
      toastNotice.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastNotice.classList.remove('show');
      }, duration);
    }

    function handlePickPlate(plateObj) {
      if (isShopClosed) {
        showToast('오늘의 영업이 종료되었습니다! 영수증을 확인해 주세요. 🧾');
        openReceiptModal(true);
        return;
      }

      if (isCurrentlyEating) {
        showToast('아직 식사 중이에요! 다 먹고 난 뒤에 새 접시를 집을 수 있습니다.');
        return;
      }

      isCurrentlyEating = true;
      updateRailCursorState();

      const idx = activePlatesOnRail.indexOf(plateObj);
      if (idx > -1) activePlatesOnRail.splice(idx, 1);
      plateObj.el.remove();

      const displayClone = buildPlateElement(plateObj.data);
      displayClone.className = 'active-sushi-display';
      eatingSlot.appendChild(displayClone);

      const minTime = 5000;
      const maxTime = 8000;
      const eatDurationMs = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;
      startEatingProcess(plateObj.data, displayClone, eatDurationMs);
    }

    function startEatingProcess(plateData, displayElement, durationMs) {
      eatingStatusBar.style.display = 'flex';
      chopsticksSet.classList.add('eating-motion');
      progressFill.style.width = '100%';
      eatingStatusText.textContent = `${plateData.name} 음미하는 중...`;

      const startTime = performance.now();

      function updateProgress(now) {
        const elapsed = now - startTime;
        const remainingRatio = Math.max(0, 1 - elapsed / durationMs);

        progressFill.style.width = `${remainingRatio * 100}%`;

        if (elapsed < durationMs) {
          requestAnimationFrame(updateProgress);
        } else {
          finishEating(plateData, displayElement);
        }
      }

      requestAnimationFrame(updateProgress);
    }

    function finishEating(plateData, displayElement) {
      displayElement.remove();
      eatingStatusBar.style.display = 'none';
      chopsticksSet.classList.remove('eating-motion');

      addPlateToStack(plateData);

      isCurrentlyEating = false;
      updateRailCursorState();
    }

    function updateRailCursorState() {
      activePlatesOnRail.forEach(p => {
        if (isCurrentlyEating || isShopClosed) p.el.classList.add('disabled-pick');
        else p.el.classList.remove('disabled-pick');
      });
    }

    function recordEatenMenu(plateData) {

      const key = `${itemName}_${price}`;

    function formatCurrentDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    function formatCurrency(num) {
      return num.toLocaleString('ko-KR') + '원';
    }

    function generateReceiptCanvasDataURL(isAutoClosed = false) {
      const items = Array.from(eatenHistoryMap.values());
      const rowHeight = 28;
      const itemsBlockHeight = Math.max(1, items.length) * rowHeight;
      const closedBannerHeight = isAutoClosed ? 44 : 0;

      const paperWidth = 380;
      const paperHeight = 430 + itemsBlockHeight + closedBannerHeight;
      const marginX = 75;
      const marginY = 75;

      const canvasWidth = paperWidth + marginX * 2;
      const canvasHeight = paperHeight + marginY * 2;

      const canvas = document.createElement('canvas');
      const scale = 2; 
      canvas.width = canvasWidth * scale;
      canvas.height = canvasHeight * scale;

      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const bgGrad = ctx.createRadialGradient(
        canvasWidth / 2, canvasHeight / 2, 40,
        canvasWidth / 2, canvasHeight / 2, Math.max(canvasWidth, canvasHeight) * 0.75
      );
      bgGrad.addColorStop(0, '#4e382e');
      bgGrad.addColorStop(0.55, '#33241d');
      bgGrad.addColorStop(1, '#221712');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.strokeStyle = 'rgba(214, 159, 99, 0.22)';
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, canvasWidth - 36, canvasHeight - 36);

      ctx.save();
      ctx.translate(canvasWidth / 2, canvasHeight / 2);
      ctx.rotate(-1.8 * Math.PI / 180);
      const halfW = paperWidth / 2;
      const halfH = paperHeight / 2;
      const zigW = 10;
      const zigH = 7;

      function traceReceiptPath() {
        ctx.beginPath();
        ctx.moveTo(-halfW, -halfH + zigH);
        for (let x = -halfW; x < halfW; x += zigW) {
          const midX = Math.min(x + zigW / 2, halfW);
          const nextX = Math.min(x + zigW, halfW);
          ctx.lineTo(midX, -halfH);
          ctx.lineTo(nextX, -halfH + zigH);
        }
        ctx.lineTo(halfW, halfH - zigH);
        for (let x = halfW; x > -halfW; x -= zigW) {
          const midX = Math.max(x - zigW / 2, -halfW);
          const nextX = Math.max(x - zigW, -halfW);
          ctx.lineTo(midX, halfH);
          ctx.lineTo(nextX, halfH - zigH);
        }
        ctx.closePath();
      }

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
      ctx.shadowBlur = 26;
      ctx.shadowOffsetX = 6;
      ctx.shadowOffsetY = 14;
      traceReceiptPath();
      ctx.fillStyle = '#faf8f5';
      ctx.fill();
      ctx.restore();

      ctx.save();
      traceReceiptPath();
      ctx.clip();

      const paperGrad = ctx.createLinearGradient(-halfW, -halfH, halfW, halfH);
      paperGrad.addColorStop(0, '#fcfbf9');
      paperGrad.addColorStop(0.5, '#f4f1ea');
      paperGrad.addColorStop(1, '#ebe6dc');
      ctx.fillStyle = paperGrad;
      ctx.fillRect(-halfW, -halfH, paperWidth, paperHeight);

      const foldGrad = ctx.createLinearGradient(0, -halfH, 0, halfH);
      foldGrad.addColorStop(0, 'rgba(0, 0, 0, 0.02)');
      foldGrad.addColorStop(0.28, 'rgba(255, 255, 255, 0.35)');
      foldGrad.addColorStop(0.30, 'rgba(90, 75, 60, 0.045)');
      foldGrad.addColorStop(0.65, 'rgba(255, 255, 255, 0.25)');
      foldGrad.addColorStop(0.68, 'rgba(90, 75, 60, 0.04)');
      foldGrad.addColorStop(1, 'rgba(0, 0, 0, 0.03)');
      ctx.fillStyle = foldGrad;
      ctx.fillRect(-halfW, -halfH, paperWidth, paperHeight);

      ctx.strokeStyle = 'rgba(120, 105, 90, 0.08)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-halfW + 20, -halfH + 80);
      ctx.lineTo(halfW - 40, -halfH + 135);
      ctx.moveTo(-halfW + 45, halfH - 160);
      ctx.lineTo(halfW - 15, halfH - 115);
      ctx.stroke();

      let curY = -halfH + 46;
      const leftX = -halfW + 28;
      const rightX = halfW - 28;

      ctx.fillStyle = '#1e1b18';
      ctx.textAlign = 'center';
      ctx.font = '900 22px "Pretendard", "Malgun Gothic", sans-serif';
      ctx.fillText('사르디나 회전초밥', 0, curY);

      curY += 20;
      ctx.fillStyle = '#665e57';
      ctx.font = '600 11.5px "Courier New", monospace';
      ctx.fillText('SARDINA KAITEN-ZUSHI RECEIPT', 0, curY);

      curY += 24;
      ctx.fillStyle = '#4a433d';
      ctx.font = '500 12px "Pretendard", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`결제일시: ${formatCurrentDateTime()}`, leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText('POS #01', rightX, curY);

      function drawDottedDivider(yPos) {
        ctx.save();
        ctx.strokeStyle = '#7a7067';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(leftX, yPos);
        ctx.lineTo(rightX, yPos);
        ctx.stroke();
        ctx.restore();
      }

      curY += 14;
      drawDottedDivider(curY);

      curY += 20;
      ctx.fillStyle = '#2b2623';
      ctx.font = '700 12.5px "Pretendard", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('메뉴명 (ITEM)', leftX, curY);
      ctx.textAlign = 'center';
      ctx.fillText('수량', 48, curY);
      ctx.textAlign = 'right';
      ctx.fillText('금액 (PRICE)', rightX, curY);

      curY += 10;
      drawDottedDivider(curY);

      curY += 24;
      let totalAmount = 0;
      ctx.font = '500 13px "Pretendard", sans-serif';

      items.forEach(item => {
        const lineTotal = item.price * item.count;
        totalAmount += lineTotal;

        ctx.fillStyle = '#221e1b';
        ctx.textAlign = 'left';
        ctx.fillText(item.name, leftX, curY);

        ctx.textAlign = 'center';
        ctx.fillText(`${item.count}`, 48, curY);

        ctx.textAlign = 'right';
        ctx.fillText(formatCurrency(lineTotal), rightX, curY);

        curY += rowHeight;
      });

      curY -= 8;
      drawDottedDivider(curY);

      const vatAmount = Math.round(totalAmount / 11);
      const supplyAmount = totalAmount - vatAmount;

      curY += 22;
      ctx.font = '600 12.5px "Pretendard", sans-serif';
      ctx.fillStyle = '#554d46';
      ctx.textAlign = 'left';
      ctx.fillText('총 먹은 접시 (TOTAL QTY)', leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText(`${eatenPlatesCount}접시`, rightX, curY);

      curY += 20;
      ctx.textAlign = 'left';
      ctx.fillText('공급가액 (SUBTOTAL)', leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText(formatCurrency(supplyAmount), rightX, curY);

      curY += 20;
      ctx.textAlign = 'left';
      ctx.fillText('부가세 (VAT 10%)', leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText(formatCurrency(vatAmount), rightX, curY);

      curY += 26;
      ctx.fillStyle = '#14110f';
      ctx.font = '900 17px "Pretendard", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('결제금액 (TOTAL)', leftX, curY);
      ctx.textAlign = 'right';
      ctx.fillText(formatCurrency(totalAmount), rightX, curY);

      curY += 14;
      drawDottedDivider(curY);

      if (isAutoClosed) {
        curY += 28;
        ctx.save();
        ctx.strokeStyle = '#b8252a';
        ctx.lineWidth = 1.8;
        ctx.strokeRect(leftX + 10, curY - 18, paperWidth - 76, 26);
        ctx.fillStyle = '#b8252a';
        ctx.font = '800 12.5px "Pretendard", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`★ ${MAX_PLATES_LIMIT}접시 달성! 오늘의 영업이 종료되었습니다 ★`, 0, curY);
        ctx.restore();
        curY += 16;
      }

      curY += 26;
      ctx.fillStyle = '#3b3530';
      ctx.font = '700 12px "Pretendard", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('THANK YOU FOR DINING WITH US!', 0, curY);

      curY += 17;
      ctx.fillStyle = '#756a60';
      ctx.font = '600 11.5px "Courier New", monospace';
      ctx.fillText('plate.sardina.love', 0, curY);

      curY += 18;
      const barcodeHeight = 52;
      ctx.fillStyle = '#181512';

      const barPattern = [
        3, 1, 2, 1, 4, 1, 1, 2, 3, 1, 2, 1, 1, 3, 2, 1,
        2, 1, 4, 1, 2, 1, 3, 1, 1, 2, 1, 3, 1, 2, 2, 1,
        3, 1, 1, 2, 4, 1, 2, 1, 3
      ];
      const unitWidth = 3.1; 
      const totalBarWidth = barPattern.reduce((sum, val) => sum + val * unitWidth, 0);
      let bx = -totalBarWidth / 2;

      for (let i = 0; i < barPattern.length; i++) {
        const w = barPattern[i] * unitWidth;
        if (i % 2 === 0) {
          ctx.fillRect(bx, curY, w, barcodeHeight);
        }
        bx += w;
      }

      curY += barcodeHeight + 15;
      ctx.fillStyle = '#554d46';
      ctx.font = '600 11px "Courier New", monospace';
      ctx.fillText(`* SRDN-${String(eatenPlatesCount).padStart(2, '0')}-${String(totalAmount).padStart(6, '0')} *`, 0, curY);

      ctx.restore(); 
      ctx.restore(); 

      return canvas.toDataURL('image/png');
    }

    function openReceiptModal(isAutoClosed = false) {
      if (eatenPlatesCount === 0) {
        showToast('아직 접시가 없어요! 초밥을 1접시 이상 드셔보세요.');
        return;

      const dataUrl = generateReceiptCanvasDataURL(isAutoClosed);

    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const imageModal = document.getElementById('imageModal');
    const imageFileInput = document.getElementById('imageFileInput');
    const savedImagesGrid = document.getElementById('savedImagesGrid');

    openModalBtn.addEventListener('click', () => imageModal.classList.add('open'));
    closeModalBtn.addEventListener('click', () => imageModal.classList.remove('open'));
    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) imageModal.classList.remove('open');
    });

    imageFileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async (event) => {
          const trimmedDataUrl = await autoCropTransparentImage(event.target.result);
          await saveCustomImage(trimmedDataUrl);
        };
        reader.readAsDataURL(file);
      });
      imageFileInput.value = '';
    });

    function renderSavedImagesGrid() {
      savedImagesGrid.innerHTML = '';
      customImagesList.forEach(item => {
        const thumb = document.createElement('div');
        thumb.className = 'saved-thumb';

        const img = document.createElement('img');
        img.src = item.dataUrl;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-thumb-btn';
        delBtn.innerHTML = '&times;';
        delBtn.title = '삭제';
        delBtn.addEventListener('click', () => deleteCustomImage(item.id));

        thumb.appendChild(img);
        thumb.appendChild(delBtn);
        savedImagesGrid.appendChild(thumb);
      });
    }

    initDatabase().then(() => {
      initRail();
      requestAnimationFrame(animateRail);
    });
  </script>
</body>
</html>
